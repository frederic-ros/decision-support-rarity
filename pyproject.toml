[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-al"
version = "2.0.0"
description = "Risk-aware active learning under class rarity: a decision framework and cross-domain evaluation (ESWA)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Frederic Ros"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "imbalanced-learn>=0.11",
  "statsmodels>=0.14",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
images = ["torch>=2.0", "torchvision>=0.15"]
boost = ["lightgbm>=4.0", "xgboost>=2.0"]
tabpfn = ["tabpfn>=0.1"]
all = ["torch>=2.0", "torchvision>=0.15", "lightgbm>=4.0", "xgboost>=2.0"]

[project.scripts]
rare-al = "rare_al.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rare_al = ["py.typed"]
